# Builds a Windows installer.
#
# The point of this workflow is that installing the app should not require a
# Rust toolchain, MSVC Build Tools, or a 15-minute compile on the target
# machine. GitHub's windows-latest runner has all of that; the operator gets a
# double-click installer instead.
#
# It runs on every push to main, so there is always a current installer waiting
# on the newest run — nobody has to remember to kick a build before they can
# install. Push a `v*` tag to additionally cut a tagged release, or use Run
# workflow from the Actions tab for an ad-hoc build of another branch.

name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

# A Windows runner build is ~20 minutes. If two commits land close together the
# older installer is already obsolete, so don't pay for it twice.
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

# Read is enough for the build; the tagged-release step needs write to create
# the release. Repos default to read-only tokens, which would fail that step at
# the very end of a 20-minute run.
permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    # A cold Rust build of the full dependency tree is slow; the default 6h is
    # far more than needed but a tight limit would fail spuriously on a cold
    # cache.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # A cold cargo build here is ~15 minutes; a warm one is a couple. Keyed
      # on the lockfile so a dependency change invalidates it and nothing else
      # does.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fail fast on a broken frontend rather than after the long Rust build.
      # `tauri build` runs `bun run build` itself via beforeBuildCommand, but
      # discovering a type error 15 minutes in wastes the whole run.
      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

      - name: Build installer
        # No code-signing certificate is configured, so the bundler produces
        # unsigned artifacts. That is why SmartScreen warns on first run — see
        # the release notes step below, which says so plainly rather than
        # leaving an operator to wonder.
        run: bun run tauri build

      # `targets: "all"` produces both an MSI (WiX) and an NSIS .exe. Both are
      # uploaded: MSI suits managed/IT deployment, NSIS is the friendlier
      # double-click for a single machine.
      - name: Collect artifacts
        shell: pwsh
        run: |
          $dest = "installer-output"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $found = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Include *.msi,*.exe -ErrorAction SilentlyContinue
          if (-not $found) {
            Write-Error "No installer produced under src-tauri/target/release/bundle"
            exit 1
          }
          $found | ForEach-Object {
            Write-Host "found: $($_.FullName)  ($([math]::Round($_.Length/1MB,1)) MB)"
            Copy-Item $_.FullName -Destination $dest
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-graphics-engine-windows
          path: installer-output/*
          if-no-files-found: error
          retention-days: 30

      # Only on a version tag. A manual run leaves the artifact on the run page,
      # which is what you want for a test build — it should not mint a release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/*
          generate_release_notes: true
          body: |
            ## Install

            Download the `.exe` (NSIS) for a normal install, or the `.msi` for
            managed deployment. Installs per-machine, so Windows will ask for
            administrator rights.

            **Windows SmartScreen will warn on first run.** These builds are
            unsigned — no code-signing certificate is configured for this
            project. Choose *More info* then *Run anyway*. Signing requires an
            EV certificate and is a separate decision.

            ### Requires nothing else
            No Rust toolchain, no Visual Studio Build Tools, no Node. WebView2
            ships with Windows 11 and current Windows 10.
