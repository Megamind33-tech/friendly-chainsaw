# Phase 8 hardening: guard every PR with the full verification suite.
#
# Two independent jobs (frontend + Rust) so a TS-only regression doesn't
# wait on Rust's cold cache. Windows/macOS bundle build is deliberately not
# in CI — cross-platform bundle validation is a separate concern (see
# docs/PHASE8_DESIGN.md's rationale).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new commit lands. Broadcast
# work has fast iteration cycles; letting stale runs finish just delays
# feedback on the newest push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-frontend:
    name: Frontend (TypeScript + verify scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bunx tsc --noEmit

      - name: Unit tests (Vitest)
        # Unit layer, added in the 2026-08 audit. Complements — does not
        # replace — the phase verification suites below: those are acceptance
        # tests per phase, this covers the data-source/data-hub/binding units
        # they never reached (see docs/AUDIT-2026-08.md, S1-6).
        run: bun run test

      - name: Production build
        run: bun run build

      # Every verification script, not a hand-maintained subset. Six of these
      # (phase3, phase5, ar-asset-builder, ar-election-slice, sports-ar-models,
      # studio-realism) were never wired in, and verify-phase3 had been failing
      # unnoticed as a result — an unclamped opacity overshoot and a
      # buildDataValues call that threw. Globbing means a new script is covered
      # the moment it lands.
      - name: Verification suites
        run: |
          status=0
          for f in scripts/verify-*.ts; do
            echo "--- $f"
            bun run "$f" || status=1
          done
          exit $status

  verify-rust:
    name: Rust (cargo check + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        # Package names verified against Ubuntu 24.04 (noble). libgtk-3-dev
        # pulls the whole GDK/GTK toolchain gdk-sys and pango-sys need at
        # compile time — cargo check fails without them (observed live in
        # Phase 7 verification).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo check --tests
        working-directory: src-tauri
        run: cargo check --tests

      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib

  verify-rust-windows:
    name: Rust (Windows — NDI / WebView2 / Spout)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Linux job above cannot compile a single line of the output path
      # that actually ships: capture.rs is entirely #[cfg(windows)], ndi.rs
      # hand-rolls the NDI SDK FFI, spout.rs is Windows/macOS, and Cargo.toml
      # pins webview2-com/windows with `=` so they match tauri's own vendored
      # versions exactly. Hand-rolled FFI behind exact version pins is exactly
      # the code that most needs a compile gate — and it had none until the
      # 2026-08 audit (docs/AUDIT-2026-08.md, S1-7).
      #
      # No NDI SDK is installed here on purpose: ndi.rs dynamic-loads at
      # runtime (libloading) rather than linking at build time, so a machine
      # without the SDK still compiles and honestly reports unavailable. That
      # design is what makes this job cheap — and this job is what keeps that
      # design from silently breaking.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo check --tests (windows target)
        working-directory: src-tauri
        run: cargo check --tests

      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib
