# Diagnostic. Delete once CI is green.
#
# Every workflow run in this repository has failed within ~5 seconds since the
# first push, on ubuntu-latest and windows-latest alike, with no runner
# assigned, no steps and an empty log archive. Two settings produce exactly
# that, and they have different fixes:
#
#   1. Actions permissions restrict which actions may run. Then even
#      actions/checkout@v4 is refused and the job dies before starting.
#      Fix: Settings -> Actions -> General -> Allow all actions.
#   2. The account cannot bill Actions (payment hold or spending limit).
#      Fix: github.com/settings/billing.
#
# This workflow uses NO actions at all — no checkout, no setup-*, nothing with
# a `uses:`. So it isolates the two:
#
#   passes -> cause is (1), the allowed-actions policy
#   fails  -> cause is (2), account/billing
name: Actions probe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    name: Can this account run any job at all
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        run: |
          echo "A runner started and executed a step."
          echo "runner os: $RUNNER_OS"
          echo "repo:      $GITHUB_REPOSITORY"
          echo "sha:       $GITHUB_SHA"
